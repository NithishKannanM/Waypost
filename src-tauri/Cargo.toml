[package]
name = "cc-console"
version = "0.1.0"
description = "Claude Code session & skill console"
authors = ["Nithish Kannan M"]
edition = "2021"

[lib]
name = "cc_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` so the build doesn't depend on the host's sqlite, and so FTS5 is
# guaranteed present for M2's search.
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
